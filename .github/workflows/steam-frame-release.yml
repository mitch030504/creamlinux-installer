name: Steam Frame release validation (never publishes)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted x86 runner or an explicitly provisioned isolated builder (30 GB free recommended)
        type: choice
        options: [ubuntu-24.04, steam-frame-release-x64]
        default: ubuntu-24.04
      reproducibility:
        description: Build twice and compare exact bytes/inventories
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: frame-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # The self-hosted label is a documented opt-in; no runner is assumed to exist.
    runs-on: ${{ inputs.runner == 'steam-frame-release-x64' && fromJSON('["self-hosted","linux","x64","steam-frame-release-x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      FRAME_BUILD_CONTAINER: creamlinux-frame-ci
      FRAME_BUILDER_MODE: strict
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Provision x86 controller (no signing credentials)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm binutils patch
          echo "ANDROID_NDK_HOME=$(python3 scripts/release/prepare-controller.py "$RUNNER_TEMP/ndk")" >> "$GITHUB_ENV"
      - name: Provision ARM64 emulation (privilege isolated here)
        run: docker run --rm --privileged tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
      - name: Build approved SDK and fresh container
        run: |
          python3 scripts/frame_sdk.py
          export FRAME_CONTAINER_USER="$(id -u):$(id -g)"
          echo "FRAME_CONTAINER_USER=$FRAME_CONTAINER_USER" >> "$GITHUB_ENV"
          docker run -d --user "$FRAME_CONTAINER_USER" --env HOME=/tmp/frame-ci-home --platform linux/arm64 --name "$FRAME_BUILD_CONTAINER" --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" creamlinux-frame-sdk:locked
          docker exec --user "$FRAME_CONTAINER_USER" --workdir /work "$FRAME_BUILD_CONTAINER" npm ci
      - name: Canonical release pipeline
        run: scripts/build-steam-frame-release.sh --prepare-tools --output-dir tools/android-steam-proxy/build/releases/ci-first
      - name: Verify exact artifact and export allowlisted outputs
        run: |
          python3 scripts/frame_ci.py verify tools/android-steam-proxy/build/releases/ci-first
          python3 scripts/frame_ci.py export tools/android-steam-proxy/build/releases/ci-first tools/android-steam-proxy/build/ci-upload
      - name: Optional reproducibility measurement
        if: inputs.reproducibility
        run: |
          scripts/build-steam-frame-release.sh --prepare-tools --output-dir tools/android-steam-proxy/build/releases/ci-second
          python3 scripts/frame_ci.py compare tools/android-steam-proxy/build/releases/ci-first tools/android-steam-proxy/build/releases/ci-second
          cp tools/android-steam-proxy/build/releases/ci-second/reproducibility.json tools/android-steam-proxy/build/ci-upload/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steam-frame-inspector-${{ github.run_id }}
          path: tools/android-steam-proxy/build/ci-upload/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Export safe failure diagnostics
        if: failure()
        run: |
          if test -f tools/android-steam-proxy/build/releases/ci-first/release-manifest.json; then
            python3 scripts/frame_ci.py export-failure tools/android-steam-proxy/build/releases/ci-first tools/android-steam-proxy/build/ci-failure
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: steam-frame-failure-${{ github.run_id }}
          path: tools/android-steam-proxy/build/ci-failure/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop only the owned CI container
        if: always()
        run: docker rm -f "$FRAME_BUILD_CONTAINER" || true
