name: Steam Frame tests (no signing)
on:
  pull_request:
    paths: ['scripts/**', 'docker/steam-frame-release/**', 'tools/android-steam-proxy/**', 'src/**', 'src-tauri/**', 'package*.json', '.github/workflows/steam-frame-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Prepare patched checksum-pinned npm (no global installation)
        run: |
          npm_bin="$(python3 scripts/release/prepare-npm.py "$RUNNER_TEMP/frame-npm-${{ github.job }}")"
          echo "$npm_bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58 # resolved 1.96.0 toolchain action
        with:
          toolchain: '1.96.0'
      - name: Controller test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils zstd libedit2 libtinfo6 libxml2 libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev
          ndk_home="$(python3 scripts/release/prepare-controller.py "$RUNNER_TEMP/ndk")"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - name: Prepare checksum-pinned LLVM 20.1.8 reader (no package installation)
        run: |
          llvm_bin="$(python3 scripts/release/prepare-llvm-reader.py "$RUNNER_TEMP/frame-llvm" --cache "$RUNNER_TEMP/frame-llvm-packages")"
          echo "$llvm_bin" >> "$GITHUB_PATH"
      - name: Preflight PATH reader version and representative LLVM JSON
        run: python3 scripts/release/prepare-llvm-reader.py --preflight-only --report "$RUNNER_TEMP/frame-llvm-preflight.json"
      - run: python3 -m unittest discover -s tools/android-steam-proxy/tests -p 'test_*.py'
      - run: npm ci && npm run test:lepton-ui
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features frame-inspector-only
      - run: git diff --check
